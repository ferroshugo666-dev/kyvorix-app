<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyvorix Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-50">
<header class="sticky top-0 bg-white border-b"><div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between"><div class="font-bold">Kyvorix</div><div class="text-xs text-slate-400">100% Private</div></div></header>
<main class="max-w-6xl mx-auto px-6 py-12">
<h1 class="text-5xl font-extrabold text-center">Useful tools without the headache.</h1>
<div class="mt-10 grid grid-cols-4 gap-4" id="grid"></div>
<div id="modal" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/40" onclick="closeModal()"></div><div class="relative mx-auto mt-10 max-w-2xl bg-white rounded-2xl border"><div class="p-6 border-b flex justify-between"><h2 id="modalTitle" class="font-bold"></h2><button onclick="closeModal()">X</button></div><div class="p-6" id="modalBody"></div></div></div>
</main>
<script>
const tools=[{id:'jpg2pdf',name:'JPG to PDF'},{id:'merge',name:'Merge PDF'},{id:'png2jpg',name:'PNG to JPG'},{id:'resize',name:'Resize Image'}];
document.getElementById('grid').innerHTML=tools.map(t=>`<div onclick="openTool('${t.id}')" class="rounded-2xl border bg-white p-5 cursor-pointer"><h3 class="font-semibold">${t.name}</h3></div>`).join('');
function openTool(id){document.getElementById('modalTitle').innerText=id;document.getElementById('modal').classList.remove('hidden');if(id==='jpg2pdf')renderJPG2PDF();}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function renderJPG2PDF(){
document.getElementById('modalBody').innerHTML=`<input type="file" id="files" multiple accept="image/*"><div id="preview"></div><button id="btn" class="mt-4 bg-black text-white px-6 py-3 rounded-full">Converter</button>`;
let imgs=[];
document.getElementById('files').onchange=e=>{imgs=[...e.target.files];};
document.getElementById('btn').onclick=async()=>{const {jsPDF}=window.jspdf;const pdf=new jsPDF();for(let i=0;i<imgs.length;i++){const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(imgs[i])});if(i>0)pdf.addPage();pdf.addImage(d,'JPEG',0,0,210,297);}pdf.save('kyvorix.pdf');};
}
</script>
</body>
</html>
